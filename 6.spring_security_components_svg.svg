<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- 배경 -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- 제목 -->
  <text x="600" y="30" text-anchor="middle" font-size="24" font-weight="bold" fill="#2c3e50">
    Spring Security 컴포넌트 관계도
  </text>
  
  <!-- 범례 -->
  <g transform="translate(50, 60)">
    <text x="0" y="0" font-size="14" font-weight="bold" fill="#2c3e50">범례:</text>
    <circle cx="60" cy="15" r="8" fill="#3498db"/>
    <text x="75" y="20" font-size="12" fill="#2c3e50">컨트롤러</text>
    <circle cx="150" cy="15" r="8" fill="#e74c3c"/>
    <text x="165" y="20" font-size="12" fill="#2c3e50">보안 필터</text>
    <circle cx="240" cy="15" r="8" fill="#2ecc71"/>
    <text x="255" y="20" font-size="12" fill="#2c3e50">서비스</text>
    <circle cx="320" cy="15" r="8" fill="#f39c12"/>
    <text x="335" y="20" font-size="12" fill="#2c3e50">엔티티</text>
  </g>
  
  <!-- 컨트롤러 레이어 -->
  <g transform="translate(100, 120)">
    <rect x="0" y="0" width="200" height="80" fill="#3498db" fill-opacity="0.2" stroke="#3498db" stroke-width="2" rx="10"/>
    <text x="100" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Controller Layer</text>
    
    <!-- AuthController -->
    <circle cx="50" cy="45" r="25" fill="#3498db"/>
    <text x="50" y="50" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Auth</text>
    <text x="50" y="70" text-anchor="middle" font-size="10" fill="#2c3e50">Controller</text>
    
    <!-- MemberController -->
    <circle cx="150" cy="45" r="25" fill="#3498db"/>
    <text x="150" y="50" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Member</text>
    <text x="150" y="70" text-anchor="middle" font-size="10" fill="#2c3e50">Controller</text>
  </g>
  
  <!-- Spring Security 레이어 -->
  <g transform="translate(400, 120)">
    <rect x="0" y="0" width="350" height="200" fill="#e74c3c" fill-opacity="0.2" stroke="#e74c3c" stroke-width="2" rx="10"/>
    <text x="175" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Spring Security Layer</text>
    
    <!-- Security Filter Chain -->
    <rect x="20" y="25" width="120" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="5"/>
    <text x="80" y="40" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Security</text>
    <text x="80" y="55" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Filter Chain</text>
    
    <!-- Authentication Provider -->
    <rect x="160" y="25" width="120" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="5"/>
    <text x="220" y="40" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Authentication</text>
    <text x="220" y="55" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Provider</text>
    
    <!-- Success Handler -->
    <rect x="20" y="80" width="100" height="35" fill="#27ae60" stroke="#229954" stroke-width="1" rx="5"/>
    <text x="70" y="95" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Success</text>
    <text x="70" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Handler</text>
    
    <!-- Failure Handler -->
    <rect x="135" y="80" width="100" height="35" fill="#e67e22" stroke="#d35400" stroke-width="1" rx="5"/>
    <text x="185" y="95" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Failure</text>
    <text x="185" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Handler</text>
    
    <!-- Logout Handler -->
    <rect x="250" y="80" width="80" height="35" fill="#8e44ad" stroke="#7d3c98" stroke-width="1" rx="5"/>
    <text x="290" y="95" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Logout</text>
    <text x="290" y="108" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Handler</text>
    
    <!-- UserDetailsService -->
    <rect x="80" y="130" width="120" height="40" fill="#e74c3c" stroke="#c0392b" stroke-width="1" rx="5"/>
    <text x="140" y="145" text-anchor="middle" font-size="11" fill="white" font-weight="bold">UserDetails</text>
    <text x="140" y="160" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Service</text>
    
    <!-- Password Encoder -->
    <rect x="220" y="130" width="100" height="40" fill="#34495e" stroke="#2c3e50" stroke-width="1" rx="5"/>
    <text x="270" y="145" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Password</text>
    <text x="270" y="160" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Encoder</text>
  </g>
  
  <!-- 서비스 레이어 -->
  <g transform="translate(100, 360)">
    <rect x="0" y="0" width="250" height="80" fill="#2ecc71" fill-opacity="0.2" stroke="#2ecc71" stroke-width="2" rx="10"/>
    <text x="125" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Service Layer</text>
    
    <!-- MemberService -->
    <circle cx="75" cy="45" r="25" fill="#2ecc71"/>
    <text x="75" y="50" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Member</text>
    <text x="75" y="70" text-anchor="middle" font-size="10" fill="#2c3e50">Service</text>
    
    <!-- CustomUserDetailsService -->
    <circle cx="175" cy="45" r="25" fill="#2ecc71"/>
    <text x="175" y="40" text-anchor="middle" font-size="9" fill="white" font-weight="bold">Custom</text>
    <text x="175" y="52" text-anchor="middle" font-size="9" fill="white" font-weight="bold">UserDetails</text>
    <text x="175" y="70" text-anchor="middle" font-size="10" fill="#2c3e50">Service</text>
  </g>
  
  <!-- 엔티티 레이어 -->
  <g transform="translate(500, 360)">
    <rect x="0" y="0" width="400" height="120" fill="#f39c12" fill-opacity="0.2" stroke="#f39c12" stroke-width="2" rx="10"/>
    <text x="200" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Entity Layer</text>
    
    <!-- Member Entity -->
    <rect x="30" y="25" width="80" height="60" fill="#f39c12" stroke="#e67e22" stroke-width="1" rx="5"/>
    <text x="70" y="40" text-anchor="middle" font-size="12" fill="white" font-weight="bold">Member</text>
    <text x="70" y="55" text-anchor="middle" font-size="10" fill="white">Entity</text>
    <text x="70" y="70" text-anchor="middle" font-size="9" fill="white">(UserDetails)</text>
    
    <!-- Role Enum -->
    <rect x="130" y="25" width="60" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="5"/>
    <text x="160" y="45" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Role</text>
    <text x="160" y="60" text-anchor="middle" font-size="10" fill="white">Enum</text>
    <text x="160" y="75" text-anchor="middle" font-size="9" fill="white">(USER/ADMIN)</text>
    
    <!-- MemberStatus Enum -->
    <rect x="210" y="25" width="80" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="5"/>
    <text x="250" y="40" text-anchor="middle" font-size="10" fill="white" font-weight="bold">MemberStatus</text>
    <text x="250" y="55" text-anchor="middle" font-size="10" fill="white">Enum</text>
    <text x="250" y="70" text-anchor="middle" font-size="8" fill="white">(ACTIVE/SUSPENDED)</text>
    
    <!-- MemberType Enum -->
    <rect x="310" y="25" width="70" height="60" fill="#9b59b6" stroke="#8e44ad" stroke-width="1" rx="5"/>
    <text x="345" y="40" text-anchor="middle" font-size="10" fill="white" font-weight="bold">MemberType</text>
    <text x="345" y="55" text-anchor="middle" font-size="10" fill="white">Enum</text>
    <text x="345" y="70" text-anchor="middle" font-size="8" fill="white">(REGULAR/VIP)</text>
  </g>
  
  <!-- 데이터베이스 -->
  <g transform="translate(950, 360)">
    <rect x="0" y="0" width="120" height="80" fill="#34495e" fill-opacity="0.2" stroke="#34495e" stroke-width="2" rx="10"/>
    <text x="60" y="15" text-anchor="middle" font-size="14" font-weight="bold" fill="#2c3e50">Database</text>
    
    <circle cx="60" cy="45" r="25" fill="#34495e"/>
    <text x="60" y="50" text-anchor="middle" font-size="11" fill="white" font-weight="bold">DB</text>
    <text x="60" y="70" text-anchor="middle" font-size="10" fill="#2c3e50">H2/MySQL</text>
  </g>
  
  <!-- 연결선들 -->
  <!-- Controller -> Security -->
  <line x1="300" y1="160" x2="400" y2="160" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Security -> Service -->
  <line x1="540" y1="290" x2="350" y2="360" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Service -> Entity -->
  <line x1="350" y1="405" x2="500" y2="405" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Entity -> Database -->
  <line x1="900" y1="420" x2="950" y2="420" stroke="#2c3e50" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Security Internal Connections -->
  <line x1="480" y1="185" x2="540" y2="250" stroke="#e74c3c" stroke-width="1"/>
  <line x1="620" y1="185" x2="540" y2="250" stroke="#e74c3c" stroke-width="1"/>
  
  <!-- 화살표 마커 정의 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50"/>
    </marker>
  </defs>
  
  <!-- 플로우 설명 -->
  <g transform="translate(100, 550)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2c3e50">인증 플로우 순서:</text>
    <text x="0" y="25" font-size="12" fill="#2c3e50">1. 사용자 요청 → Controller</text>
    <text x="0" y="45" font-size="12" fill="#2c3e50">2. Controller → Spring Security Filter Chain</text>
    <text x="0" y="65" font-size="12" fill="#2c3e50">3. Security → UserDetailsService → MemberService</text>
    <text x="0" y="85" font-size="12" fill="#2c3e50">4. MemberService → Member Entity → Database</text>
    <text x="0" y="105" font-size="12" fill="#2c3e50">5. 인증 성공/실패 핸들러 실행</text>
    <text x="0" y="125" font-size="12" fill="#2c3e50">6. 적절한 페이지로 리다이렉트</text>
  </g>
  
  <!-- 보안 특징 -->
  <g transform="translate(600, 550)">
    <text x="0" y="0" font-size="16" font-weight="bold" fill="#2c3e50">보안 특징:</text>
    <text x="0" y="25" font-size="12" fill="#2c3e50">• BCrypt 비밀번호 암호화</text>
    <text x="0" y="45" font-size="12" fill="#2c3e50">• 세션 기반 인증 관리</text>
    <text x="0" y="65" font-size="12" fill="#2c3e50">• 역할 기반 접근 제어 (RBAC)</text>
    <text x="0" y="85" font-size="12" fill="#2c3e50">• 커스텀 성공/실패 핸들러</text>
    <text x="0" y="105" font-size="12" fill="#2c3e50">• 안전한 로그아웃 처리</text>
  </g>
</svg>